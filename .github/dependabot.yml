version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: insider
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /font-size
    target-branch: insider
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /font-size
    target-branch: master
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /
    target-branch: master
    schedule:
      interval: monthly
    cooldown:
      default-days: 30
