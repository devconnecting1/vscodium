name: Secret Scanning

on:
  push:
    branches:
      - master
      - insider
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "0 4 * * 1"

permissions: {}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@4a5e2f5e399f4e7d4c4bf1e4ae2e4e8f5e3b2a76 # v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d905cf90c03365536d # v3.37.9
        if: always()
        with:
          sarif_file: results.sarif
