name: Lint - Biome

on:
  push:
    branches:
      - master
      - insider
    paths:
      - "font-size/**"
      - "product.json"
      - "announcements-*.json"
      - "upstream/*.json"
      - "patches/*.json"
      - ".github/workflows/biome.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "font-size/**"
      - "product.json"
      - "announcements-*.json"
      - "upstream/*.json"
      - "patches/*.json"
      - ".github/workflows/biome.yml"

permissions: {}

jobs:
  biome:
    name: Biome
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Install Biome
        run: npm install --no-save @biomejs/biome

      - name: Run Biome lint
        run: npx @biomejs/biome check . --write --no-errors-on-unmatched

      - name: Run Biome format check
        run: npx @biomejs/biome format . --write --no-errors-on-unmatched
